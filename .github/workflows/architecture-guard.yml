name: Architecture Guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  layering:
    name: Layering Guard
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 守卫只读源码，不需要 SIGN_KEY / AES_KEY：这两个密钥在任务执行期才解析，
      # 而 verifyLayering 不依赖 generateLocalSecrets。
      - name: Verify layering
        run: ./gradlew :composeApp:verifyLayering --stacktrace
