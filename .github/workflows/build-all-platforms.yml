name: Build All Platforms

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: build-all-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AES_KEY: ${{ secrets.AES_KEY }}
  AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
  MCP_SHARED_SECRET: ${{ secrets.MCP_SHARED_SECRET }}

jobs:
  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/android-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -alias ci-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -keystore "$RUNNER_TEMP/android-release.keystore" \
              -storepass android \
              -keypass android \
              -dname "CN=CI Build, OU=CI, O=Schedule2, L=Beijing, S=Beijing, C=CN"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/android-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=ci-release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Android release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Normalize Android artifact name
        run: |
          set -euo pipefail
          mkdir -p build/release-artifacts
          APK_PATH="$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No Android APK found under androidApp/build/outputs/apk/release"
            find androidApp/build/outputs/apk -maxdepth 3 -type f | sort
            exit 1
          fi
          cp "${APK_PATH}" build/release-artifacts/app-release.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/release-artifacts/app-release.apk


  ios-release:
    name: iOS IPA
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve iOS version
        run: |
          set -euo pipefail
          VERSION_FILE="iosApp/Configuration/AppVersion.xcconfig"
          BASE_VERSION="$(grep -E '^APP_VERSION_NAME=' "${VERSION_FILE}" | head -n 1 | cut -d '=' -f 2- | tr -d '[:space:]')"
          if [ -z "${BASE_VERSION}" ]; then
            echo "Failed to resolve APP_VERSION_NAME from ${VERSION_FILE}"
            exit 1
          fi
          TAG_VERSION=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            TAG_VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi

          HASH_CODE="${GITHUB_SHA:-}"
          if [ -z "${HASH_CODE}" ]; then
            HASH_CODE="$(git rev-parse --short HEAD 2>/dev/null || true)"
          fi
          HASH_CODE="$(echo "${HASH_CODE}" | tr -d '[:space:]' | cut -c1-7)"
          if [ -z "${HASH_CODE}" ]; then
            HASH_CODE="local"
          fi

          if [ -n "${TAG_VERSION}" ]; then
            IOS_RELEASE_MARKETING_VERSION="${TAG_VERSION}"
          else
            IOS_RELEASE_MARKETING_VERSION="${BASE_VERSION}Alpha(${HASH_CODE})"
          fi
          IOS_RELEASE_BUILD_NUMBER="$(grep -E '^APP_VERSION_CODE=' "${VERSION_FILE}" | head -n 1 | cut -d '=' -f 2- | tr -d '[:space:]')"
          if [ -z "${IOS_RELEASE_MARKETING_VERSION}" ] || [ -z "${IOS_RELEASE_BUILD_NUMBER}" ]; then
            echo "Failed to resolve APP_VERSION_NAME/APP_VERSION_CODE from ${VERSION_FILE}"
            exit 1
          fi
          IOS_BUILD_NUMBER="${IOS_RELEASE_BUILD_NUMBER}"
          echo "IOS_MARKETING_VERSION=${IOS_RELEASE_MARKETING_VERSION}" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=${IOS_BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "Resolved iOS version: ${IOS_RELEASE_MARKETING_VERSION} (${IOS_BUILD_NUMBER})"

      - name: Build unsigned iOS device app
        run: |
          mkdir -p build/ios
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${IOS_MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${IOS_BUILD_NUMBER}" \
            build

          APP_PATH="$(find build/ios-device-derived-data/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "No .app product found under Release-iphoneos"
            find build/ios-device-derived-data/Build/Products -maxdepth 2 -type d -name '*.app' | sort
            exit 1
          fi

          rm -rf build/ios/Payload
          mkdir -p build/ios/Payload
          cp -R "${APP_PATH}" build/ios/Payload/
          (
            cd build/ios
            ditto -c -k --sequesterRsrc --keepParent Payload app-release.ipa
          )

      - name: Upload unsigned iOS IPA
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 == '' || env.IOS_CERTIFICATE_PASSWORD == '' || env.IOS_MOBILEPROVISION_BASE64 == '' || env.IOS_TEAM_ID == '' || env.IOS_BUNDLE_ID == '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/ios/app-release.ipa

      - name: Import iOS signing assets
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_MOBILEPROVISION_BASE64 != '' && env.IOS_TEAM_ID != '' && env.IOS_BUNDLE_ID != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"

      - name: Build signed iOS IPA
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_MOBILEPROVISION_BASE64 != '' && env.IOS_TEAM_ID != '' && env.IOS_BUNDLE_ID != '' }}
        env:
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          EXPORT_METHOD="${IOS_EXPORT_METHOD:-development}"
          mkdir -p build/ios
          cat > build/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath build/ios/iosApp.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${IOS_BUNDLE_ID}" \
            MARKETING_VERSION="${IOS_MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${IOS_BUILD_NUMBER}" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/iosApp.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist build/ios/ExportOptions.plist

          SIGNED_IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "${SIGNED_IPA_PATH}" ]; then
            echo "No signed .ipa product found under build/ios/ipa"
            find build/ios/ipa -maxdepth 2 -type f | sort
            exit 1
          fi
          mv "${SIGNED_IPA_PATH}" build/ios/app-release.ipa

      - name: Upload signed iOS IPA
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_MOBILEPROVISION_BASE64 != '' && env.IOS_TEAM_ID != '' && env.IOS_BUNDLE_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/ios/app-release.ipa

  publish-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - android-release
      - ios-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Show collected artifacts
        run: find dist -type f | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/**/*.apk
            dist/**/*.ipa
