<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="preconnect" href="https://chrnova.version.restarhalf.dpdns.org" />
    <title>Chrnova - 下载</title>
    <meta
      name="description"
      content="Chrnova - 校园课程表，一站式课程管理，成绩查询、考试安排、课程提醒尽在掌握。"
    />
    <!-- share cards: QQ / WeChat / social previews.
         og:image needs an absolute URL — add it once the domain is final. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chrnova - 校园课程表" />
    <meta
      property="og:description"
      content="课程管理、成绩查询、考试安排、课程提醒，尽在掌握。"
    />
    <meta name="twitter:card" content="summary" />
    <script type="module" crossorigin src="./assets/index-DPFRCwu-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dz3BUU3f.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid-glass refraction: a soft edge lens that warps the backdrop
         toward the surface rim, plus a large-scale ripple. Both turbulence
         fields are animated from JS (useLiquidLens) so the refraction
         flows like a living liquid (Chromium only) -->
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0">
      <filter id="liquid-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence id="lens-noise-a" type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="3" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.2" result="soft" />
        <feDisplacementMap id="lens-displace-a" in="SourceGraphic" in2="soft" scale="14" xChannelSelector="R" yChannelSelector="G" result="warped" />
        <feTurbulence id="lens-noise-b" type="turbulence" baseFrequency="0.004 0.006" numOctaves="2" seed="7" result="ripple-noise" />
        <feGaussianBlur in="ripple-noise" stdDeviation="0.6" result="ripple-soft" />
        <feDisplacementMap id="lens-displace-b" in="warped" in2="ripple-soft" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
  </body>
</html>
